<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaTech AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Decorators -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>

    <div class="app-container">
        <!-- Header Section -->
        <header class="chat-header">
            <div class="logo">
                <span class="gradient-text">NovaTech</span> Assistant
            </div>
            <p class="subtitle">Your enterprise policy companion powered by RAG</p>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-box" id="chat-box">
            <div class="message assistant-message entry-animation">
                <div class="avatar">🤖</div>
                <div class="bubble">
                    Hello! I'm your NovaTech AI Assistant. Ask me anything about our company overview, HR policies, security guidelines, or product documentation.
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="input-area">
            <form id="chat-form" onsubmit="event.preventDefault(); sendMessage();">
                <input type="text" id="user-input" placeholder="Type your question here (e.g. 'What is our leave policy?')..." autocomplete="off" required>
                <button type="submit" id="send-button">
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="20" width="20" xmlns="http://www.w3.org/2000/svg">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
